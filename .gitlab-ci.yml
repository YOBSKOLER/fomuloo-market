image: python:3.13

stages:
  - test

api-tests:
  stage: test
  variables:
    DB_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/contacts"
    POSTGRES_DB: contacts
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  services:
    - name: postgres:16-alpine
      alias: postgres
  script:
    - python -m pip install -r requirements-dev.txt
    - alembic upgrade head
    - python -m pytest --cov=contacts --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
